version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait 3 days before opening a bump PR so freshly published versions get
    # a chance to be flagged for supply-chain issues before they land.
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns:
          - "*"
    # github.com/oapi-codegen/runtime is the one consumer dependency and is versioned
    # apart from the generator (the generator module does not require it), so a patch bump
    # PR is safe to take: CI compiles the generated client against it and the hermetic
    # regenerate proves the output did not move.
    # runtime 1.8 raises the module's go directive to 1.25, dropping the 1.24 consumers
    # the CI matrix covers; adopt it deliberately together with that floor change.
    ignore:
      - dependency-name: "github.com/oapi-codegen/runtime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /tools/roxygen
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns:
          - "*"
    # The generator version is pinned and drives the generated output; bump it
    # deliberately and regenerate, never via an automated PR.
    ignore:
      - dependency-name: "github.com/oapi-codegen/oapi-codegen/v2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
